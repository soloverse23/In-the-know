[project]
name = "intheknow"
version = "1.0.0"
description = "In The Know: the memory and analyst of a small business, inside Claude (MCP server with in-chat UI)"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "mcp>=2.3",
    "cryptography>=43",
    "httpx2>=2.16",
    "uvicorn>=0.30",
    "google-cloud-firestore>=2.16",
]

[dependency-groups]
dev = ["pytest>=8", "anthropic>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["intheknow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
